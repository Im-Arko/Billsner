services:
  mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: billanalyser
      MYSQL_USER: billuser
      MYSQL_PASSWORD: billpass
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+aiomysql://billuser:billpass@mariadb:3306/billanalyser
      DATABASE_SYNC_URL: mysql+pymysql://billuser:billpass@mariadb:3306/billanalyser
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      UPLOAD_DIR: /app/uploads
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - uploads:/app/uploads
      - chroma_data:/app/data/chroma
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: mysql+aiomysql://billuser:billpass@mariadb:3306/billanalyser
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      UPLOAD_DIR: /app/uploads
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - uploads:/app/uploads
      - chroma_data:/app/data/chroma
    depends_on:
      - backend
      - redis
      - mariadb

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
  uploads:
  chroma_data:
